<!DOCTYPE html>
<html>
<head>
  <title>my Calculator</title>
<link rel="stylesheet" href="./index.css">
</head>
<body>
  <div class="eva">
<b><h3>new version calculator <br>
  created by Evariste on
  2025</h3></b>
  </div>
  <section class="container" id="calculator">
  <div class="calculator" id="cal">
  <input type="text" id="display" placeholder="0" write-only>
  </div>
  <!-- Buttons -->
  <br>
  <div class="butt">
    <button onclick="clearDisplay()">C</button>
  <button onclick="dividetoDisplay('')">/</button>
  <button onclick="multiplytoDisplay('')">*</button>
  <button onclick="clearDisplay()" >d</button>
    <button onclick="appendToDisplay('7')">7</button>
<button onclick="appendToDisplay('8')" >8</button>
<button onclick="appendToDisplay('9')">9</button>
  <button onclick="appendToDisplay('-')">-</button>
<button onclick="appendToDisplay('4')" >4</button>
<button onclick="appendToDisplay('5')" >5</button>
<button onclick="appendToDisplay('6')" >6</button>
  <button onclick="appendToDisplay('+')">+</button>
  <button onclick="appendToDisplay('1')">1</button>
  <button onclick="appendToDisplay('2')">2</button>
  <button onclick="appendToDisplay('3')">3</button>
  <button onclick="calculate()">=</button>
<button onclick="percentToDisplay('')" >%</button>
  <button onclick="appendToDisplay('0')" >0</button>
  <button onclick="appendToDisplay('.')">.</button>
  <button onclick="appendToDisplay('happy new year 2026')">o</button>
  </div>
  <script>
    function appendToDisplay(value) {
      document.getElementById('display').value += value;
    }
    function calculate() {
      const display = document.getElementById('display');
      display.value = eval(display.value);
      
    }

    function clearDisplay() {
      document.getElementById('display').value = ' ';
    }
    function dividetoDisplay(){
      document.getElementById('display').value += '/';
    }
    function multiplytoDisplay()
    {
      document.getElementById('display').value +='*';
    }
    function percentToDisplay()
    {
      document.getElementById('display').value +='%';
    }
  </script>
  </div>
  </section>
</body>
</html>
